name: saiyan_official
description: "Official SAIYAN Application"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  suffadaemon:
    path: ../suffadaemon

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  auto_route: ^10.1.2
  auto_route_generator: ^10.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.7.1
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/saiyan.jpg
    - assets/images/saiyan_pr.png
    - assets/images/saiyan_pr_black.png
    - assets/images/default_pp.jpg
    - assets/images/banner.jpg
    - assets/images/pofudukayicik.png
    - assets/images/donate.png